
<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mente en Juego - Inicio Jugadora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f6fb;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0b2d5c;
    }

    /* ENCABEZADO */

    .encabezado {
      background: #0b4dad;
      color: white;
      padding: 16px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .marca-club {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .escudo-club {
      width: 48px;
      height: 55px;
      object-fit: contain;
    }

    .marca-club h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: 1px;
    }

    .marca-club p {
      margin: 5px 0 0;
      font-size: 12px;
      color: #e2edff;
    }

    .btn-salir {
      background: white;
      color: #0b4dad;
      border: 1px solid #dbeafe;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-salir:hover {
      background: #eaf2ff;
    }

    /* CONTENIDO */

    .contenedor {
      max-width: 720px;
      margin: 55px auto;
      padding: 0 20px;
    }

    .tarjeta {
      background: white;
      border: 1px solid #d6e0ee;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }

    .bienvenida {
      text-align: center;
      margin-bottom: 35px;
    }

   .bienvenida h2 {
  margin: 0 0 14px;
  font-size: 34px;
  font-weight: 900;
  color: #0b2d5c;
  letter-spacing: 0.3px;
}
  .nombre-jugadora {
  font-size: 22px;
  font-weight: 800;
  color: #0b4dad;
  margin: 0 0 16px;
}

.descripcion {
  color: #64748b;
  font-size: 15px;
  line-height: 1.5;
}
    /* OPCIONES */

    .opciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .btn-evaluacion {
      min-height: 175px;
      background: white;
      border: 1.5px solid #b8cce6;
      border-radius: 14px;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      color: #0b2d5c;
      transition: background .2s, border-color .2s, transform .2s;
    }

    .btn-evaluacion:hover {
      background: #edf4ff;
      border-color: #0b4dad;
      transform: translateY(-2px);
    }

    .btn-evaluacion:focus-visible,
    .btn-salir:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 3px;
    }

    .icono-opcion {
      font-size: 38px;
      line-height: 1;
      color: #0b4dad;
    }

    .btn-evaluacion strong {
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }

    .btn-evaluacion span:last-child {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    /* CELULARES */

    @media (max-width: 600px) {
      .encabezado {
        padding: 12px;
      }

      .escudo-club {
        width: 36px;
        height: 42px;
      }

      .marca-club {
        gap: 8px;
      }

      .marca-club h1 {
        font-size: 15px;
      }

      .marca-club p {
        font-size: 10px;
      }

      .btn-salir {
        padding: 8px;
        font-size: 10px;
      }

      .contenedor {
        margin: 25px auto;
        padding: 0 12px;
      }

      .tarjeta {
        padding: 22px 16px;
      }

     .bienvenida h2 {
  font-size: 27px;
}

.nombre-jugadora {
  font-size: 18px;
}

.descripcion {
  font-size: 13px;
}

      .opciones {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .btn-evaluacion {
        min-height: 155px;
        padding: 12px 6px;
      }

      .btn-evaluacion strong {
        font-size: 11px;
      }

      .icono-opcion {
        font-size: 30px;
      }
    }
    /* NUEVO ENCABEZADO INSTITUCIONAL */

.encabezado {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  background: #0b4dad;
  padding: 12px 30px;
  color: white;
  min-height: 110px;
}

/* IZQUIERDA */

.titulo-sistema {
  justify-self: start;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
}

/* CENTRO */

.identidad-club {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}

.fondo-escudo {
  width: 76px;
  height: 76px;
  background: white;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 7px;
}

.escudo-central {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.identidad-club span {
  color: white;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.7px;
}

/* DERECHA */

.encabezado .btn-salir {
  justify-self: end;
}

/* ADAPTACIÓN PARA CELULARES */

@media (max-width: 600px) {
  .encabezado {
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "titulo salir"
      "club club";
    gap: 12px;
    padding: 14px;
  }

  .titulo-sistema {
    grid-area: titulo;
    font-size: 16px;
  }

  .identidad-club {
    grid-area: club;
  }

  .encabezado .btn-salir {
    grid-area: salir;
    font-size: 10px;
    padding: 8px;
  }

  .fondo-escudo {
    width: 65px;
    height: 65px;
  }
}


/* MODAL DE EVALUACIONES */

.modal-evaluacion[hidden] {
  display: none;
}

.modal-evaluacion {
  position: fixed;
  inset: 0;
  background: rgba(3, 12, 30, 0.75);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-contenido {
  width: 96vw;
  max-width: 1500px;
  height: auto;
max-height: 92vh;
  background: #ffffff;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.modal-encabezado {
  background: #0b4dad;
  color: white;
  padding: 20px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.modal-encabezado h2 {
  margin: 0 0 6px;
  font-size: 23px;
}

.modal-encabezado p {
  margin: 0;
  font-size: 13px;
  color: #e2edff;
}

.modal-cerrar {
  background: transparent;
  color: white;
  border: none;
  font-size: 32px;
  cursor: pointer;
  padding: 0 8px;
}

.modal-cuerpo {
  padding: 30px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.modal-cuerpo h3 {
  margin-top: 0;
}

.modal-pie {
  padding: 16px 26px;
  border-top: 1px solid #d6e0ee;
  display: flex;
  justify-content: flex-end;
}

.modal-btn-volver {
  background: #0b4dad;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 11px 22px;
  font-weight: 700;
  cursor: pointer;
}

.modal-cerrar:focus-visible,
.modal-btn-volver:focus-visible {
  outline: 3px solid #60a5fa;
  outline-offset: 3px;
}

@media (max-width: 600px) {
  .modal-evaluacion {
    padding: 8px;
  }

  .modal-contenido {
    max-height: 96vh;
  }

  .modal-encabezado {
    padding: 16px;
  }

  .modal-encabezado h2 {
    font-size: 18px;
  }

  .modal-cuerpo {
    padding: 18px;
  }

  .modal-pie {
    padding: 12px 16px;
  }
}
  </style>
<link rel="stylesheet" href="tema-institucional-mej.css" />
<script src="modal-global-mej.js"></script>
<link rel="stylesheet" href="mej-cabecera-unica.css?v=3" />
<link rel="stylesheet" href="mej-responsive.css?v=1" />
</head>

<body>

 <header class="encabezado">

  <!-- IZQUIERDA: NOMBRE DEL SISTEMA -->
  <div class="titulo-sistema">
    MENTE EN JUEGO
  </div>

  <!-- CENTRO: ESCUDO INSTITUCIONAL -->
  <div class="identidad-club">
    <div class="fondo-escudo">
      <img
        src="assets/logo_talleres.png"
        alt="Escudo del Club Atlético Talleres"
        class="escudo-central"
      />
    </div>

    <span>CLUB ATLÉTICO TALLERES</span>
  </div>

  <!-- DERECHA: CERRAR SESIÓN -->
  <button
    type="button"
    class="btn-salir"
    onclick="cerrarSesion()"
  >
    CERRAR SESIÓN
  </button>

</header>

  <main class="contenedor">
    <section class="tarjeta">

      <div class="bienvenida">
        <h2>Bienvenida</h2>

        <p
          id="nombreJugadora"
          class="nombre-jugadora"
        ></p>

        <p class="descripcion">
          Seleccioná la evaluación que vas a realizar.
        </p>
      </div>

      <div class="opciones">

        <button
          type="button"
          class="btn-evaluacion"
          onclick="seleccionarEvaluacion('PRE')"
        >
          <span class="icono-opcion" aria-hidden="true">▤</span>
          <strong>PREVIO-ENTRENAMIENTO</strong>
          <span>Antes de entrenar</span>
        </button>

        <button
          type="button"
          class="btn-evaluacion"
          onclick="seleccionarEvaluacion('POST')"
        >
          <span class="icono-opcion" aria-hidden="true">◉</span>
          <strong>POST-ENTRENAMIENTO</strong>
          <span>Después de entrenar</span>
        </button>

      </div>

    </section>
  </main>

  <!-- MODAL DE EVALUACIONES PRE / POST -->

<div
  id="modalEvaluacion"
  class="modal-evaluacion"
  role="dialog"
  aria-modal="true"
  aria-labelledby="tituloModalEvaluacion"
  hidden
>
  <div class="modal-contenido">

    <div class="modal-encabezado">
      <div>
        <h2 id="tituloModalEvaluacion">
          Evaluación deportiva
        </h2>

        <p id="subtituloModalEvaluacion">
          Mente en Juego - Club Atlético Talleres
        </p>
      </div>

      <button
        type="button"
        class="modal-cerrar"
        onclick="cerrarModalEvaluacion()"
        aria-label="Cerrar evaluación"
      >
        &times;
      </button>
    </div>

    <div class="modal-cuerpo" id="contenidoModalEvaluacion">
  <iframe
    id="iframeEvaluacion"
    title="Formulario de evaluación deportiva"
    src="about:blank"
    style="
      width: 100%;
    height: 540px;
min-height: 0;
      border: none;
      background: #f6f7fb;
      border-radius: 8px;
    "
  ></iframe>
</div>

    <div class="modal-pie">
      <button
        type="button"
        class="modal-btn-volver"
        onclick="cerrarModalEvaluacion()"
      >
        Volver
      </button>
    </div>

  </div>
</div>

  <script>
    const token = localStorage.getItem("token");
    const rol = localStorage.getItem("rolUsuario");

    if (!token || rol !== "jugadora") {
      window.location.replace("login.html");
    } else {
      document.getElementById("nombreJugadora").textContent =
        localStorage.getItem("nombreUsuario") || "Jugadora";
    }

   function mostrarAvisoInicioMEJ(mensaje) {
     if (typeof window.mostrarErrorMEJ === "function") {
       return window.mostrarErrorMEJ(mensaje);
     }
     console.warn("Aviso Mente en Juego:", mensaje);
     return Promise.resolve();
   }

   async function seleccionarEvaluacion(tipo) {
  if (tipo !== "PRE" && tipo !== "POST") {
    mostrarAvisoInicioMEJ("Tipo de evaluación no válido.");
    return;
  }

  const token = localStorage.getItem("token");

  if (!token) {
    window.location.replace("login.html");
    return;
  }

  try {
    const respuesta = await fetch(
      `https://localhost:7012/api/evaluaciones/validar-ventana-encuesta?momento=${tipo}`,
      {
        method: "GET",
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: "application/json"
        }
      }
    );

    if (respuesta.status === 401 || respuesta.status === 403) {
      await mostrarAvisoInicioMEJ("Tu sesión no está autorizada. Volvé a iniciar sesión.");
      window.location.replace("login.html");
      return;
    }

    if (!respuesta.ok) {
      throw new Error("No se pudo validar el horario de la evaluación.");
    }

    const datos = await respuesta.json();

    if (!datos.habilitado) {
      mostrarAvisoInicioMEJ(datos.mensaje || "La evaluación no está habilitada en este momento.");
      return;
    }

    if (!datos.sesionDeportivaId) {
      mostrarAvisoInicioMEJ("No se encontró una sesión deportiva válida.");
      return;
    }

    // Guardamos temporalmente la selección para utilizarla
    // cuando conectemos el formulario.
    sessionStorage.setItem("momentoEvaluacion", tipo);
    sessionStorage.setItem(
      "sesionDeportivaId",
      String(datos.sesionDeportivaId)
    );

abrirModalEvaluacion(tipo);

  } catch (error) {
    console.error("Error al validar la evaluación:", error);

    mostrarAvisoInicioMEJ(
      "No se pudo conectar con el servidor. " +
      "Comprobá que el backend esté ejecutándose."
    );
  }
}

let elementoAnteriorModal = null;

function abrirModalEvaluacion(tipo) {
  const modal = document.getElementById("modalEvaluacion");
  const titulo = document.getElementById("tituloModalEvaluacion");

  elementoAnteriorModal = document.activeElement;

  titulo.textContent =
    tipo === "PRE"
      ? "Evaluación PRE - Antes del entrenamiento"
      : "Evaluación POST - Después del entrenamiento";

      const iframe = document.getElementById("iframeEvaluacion");

iframe.src = "formulario_jugadora.html";
  modal.hidden = false;
  document.body.style.overflow = "hidden";

  modal.querySelector(".modal-cerrar").focus();
}

function cerrarModalEvaluacion() {
  const modal = document.getElementById("modalEvaluacion");

  modal.hidden = true;
  document.body.style.overflow = "";

  if (elementoAnteriorModal) {
    elementoAnteriorModal.focus();
  }
}

    function cerrarSesion() {
      localStorage.clear();
      window.location.replace("login.html");
    }
  </script>

<script src="mej-institucional.js"></script>
<script src="mej-cabecera-unica.js?v=3"></script>
</body>
</html>
