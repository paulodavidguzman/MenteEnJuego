<!doctype html>
<html lang="es">
  <head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mente en Juego - Acceso Talleres</title>
    <style>
      body {
        margin: 0;

        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        background: url("assets/login_talleres.jpg");

        background-size: cover;

        background-position: center;

        font-family: Segoe UI;

        overflow: hidden;
      }

      .overlay {
        position: fixed;

        inset: 0;

        background: rgba(0, 20, 60, 0.22);

        backdrop-filter: blur(2px);
      }

      .login-card {
        position: relative;

        z-index: 2;

        width: 420px;

        background: rgba(255, 255, 255, 0.95);

        border-radius: 22px;

        padding: 40px;

        text-align: center;

        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      .logo img {
        width: 70px;

        margin-bottom: 10px;
      }

      .logo h1 {
  margin: 0;
  color: #0b2d5c;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.1;
}

      .logo p {
        margin-top: 8px;

        color: #64748b;
      }

      .tabs {
        display: flex;

        margin: 25px 0;
      }

      .tab {
        flex: 1;

        padding: 14px;

        border: 1px solid #dbeafe;

        background: white;

        cursor: pointer;
      }

      .tab.activo {
        background: #0b5fff;

        color: white;
      }

      input {
        width: 100%;

        height: 50px;

        margin-bottom: 14px;

        padding: 0 16px;

        border-radius: 10px;

        border: 1px solid #dbeafe;

        box-sizing: border-box;
      }

      .btn-login {
        width: 100%;

        height: 52px;

        border: none;

        background: #0b5fff;

        color: white;

        font-weight: 700;

        border-radius: 10px;

        cursor: pointer;
      }

      .btn-login:hover {
        background: #0949c9;
      }

      #mensajeLogin {
        margin-top: 14px;
        color: #ef4444;
        font-size: 13px;
        font-weight: 700;
      }

      .password-box {
        position: relative;
      }

      .password-box input {
        padding-right: 52px;
      }

      .btn-ojo {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
      }
    </style>
  <link rel="stylesheet" href="tema-institucional-mej.css" />
<script src="modal-global-mej.js"></script>
<link rel="stylesheet" href="mej-responsive.css?v=1" />
</head>

  <body class="mej-login">
    <div class="overlay"></div>

    <div class="login-card">
      <div class="logo">
        <img src="assets/logo_talleres.png" />
        <h1>CLUB ATLÉTICO<br />TALLERES</h1>
        <p>Mente en Juego</p>
      </div>

      <div class="tabs">
        <button class="tab activo" onclick="seleccionarRol('JUGADORA', this)">
          Jugadoras
        </button>

        <button class="tab" onclick="seleccionarRol('TECNICO', this)">
          Cuerpo Técnico
        </button>

        <button class="tab" onclick="seleccionarRol('PROFESIONAL', this)">
          Profesionales
        </button>

        <button class="tab" onclick="seleccionarRol('ADMIN', this)">
          Administración
        </button>
      </div>

      <input id="email" type="email" placeholder="Usuario" />

      <div class="password-box">
        <input id="password" type="password" placeholder="Contraseña" />

        <button type="button" class="btn-ojo" onclick="togglePassword()">
          👁️
        </button>
      </div>

      <button class="btn-login" onclick="iniciarSesion()">Ingresar</button>

      <div id="mensajeLogin"></div>
    </div>

    <script>
      window.history.replaceState(null, "", "login.html");

      const API_LOGIN_URL = "https://localhost:7012/api/auth/login";

      let rolSeleccionado = "JUGADORA";

      function seleccionarRol(rol, btn) {
        rolSeleccionado = rol;

        document
          .querySelectorAll(".tab")
          .forEach((x) => x.classList.remove("activo"));

        btn.classList.add("activo");
      }

      function togglePassword() {
        const input = document.getElementById("password");
        const btn = document.querySelector(".btn-ojo");

        if (input.type === "password") {
          input.type = "text";
          btn.innerText = "🙈";
        } else {
          input.type = "password";
          btn.innerText = "👁️";
        }
      }

      async function iniciarSesion() {
        const email = document
          .getElementById("email")
          .value.trim()
          .toLowerCase();
        const password = document.getElementById("password").value;
        const mensaje = document.getElementById("mensajeLogin");

        mensaje.innerHTML = "";

        if (!email && !password) {
          mensaje.innerHTML = "Completá usuario y contraseña.";
          return;
        }

        if (!email) {
          mensaje.innerHTML = "Ingresá tu correo electrónico.";
          return;
        }

        const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailValido.test(email)) {
          mensaje.innerHTML =
            "El correo ingresado no tiene un formato válido. Ejemplo: usuario@talleres.com";
          return;
        }

        if (!password) {
          mensaje.innerHTML = "Ingresá tu contraseña.";
          return;
        }

        try {
          const response = await fetch(API_LOGIN_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              Email: email,
              Password: password,
            }),
          });

          const textoRespuesta = await response.text();

let data = {};

try {
  data = textoRespuesta ? JSON.parse(textoRespuesta) : {};
} catch {
  console.error("Respuesta del servidor:", textoRespuesta);

  mensaje.innerHTML =
    "Ocurrió un error interno en el servidor. Revisá la consola del backend.";

  return;
}

if (!response.ok) {
  mensaje.innerHTML =
    data.mensaje ||
    data.message ||
    "No se pudo iniciar sesión.";

  return;
}
          const rolReal = data.rol.toLowerCase();

         
const mapaRoles = {
  JUGADORA: ["jugadora"],
  TECNICO: ["tecnico", "entrenador"],
  PROFESIONAL: [
    "medico",
    "profesional",
    "kinesiologo",
    "kinesiologa",
    "nutricionista",
    "psicologo",
    "psicologa",
    "fisioterapeuta"
  ],
  ADMIN: ["admin"],
};

          if (!mapaRoles[rolSeleccionado]?.includes(rolReal)) {
  mensaje.innerHTML =
    `El usuario pertenece al rol ${rolReal.toUpperCase()} y no al acceso seleccionado.`;
  return;
}

          localStorage.setItem("token", data.token);
          localStorage.setItem("tipoToken", data.tipoToken || "Bearer");
          localStorage.setItem("idProfesional", data.idProfesional || "");

          localStorage.setItem("sesionActiva", "true");
          localStorage.setItem("usuarioEmailSimulado", email);
          localStorage.setItem("usuarioId", data.usuarioId);
          localStorage.setItem("nombreUsuario", data.nombreUsuario || "");
          localStorage.setItem("rolUsuario", rolReal);
          localStorage.setItem("idJugadora", data.idJugadora || "");
          localStorage.setItem(
            "especialidadMedico",
            data.especialidad || "General",
          );
          localStorage.setItem("sectorStaff", data.sector || "General");

         if (rolReal === "jugadora") {
  window.location.href = "inicio_jugadora.html";
  return;
}

          if (rolReal === "entrenador" || rolReal === "tecnico") {
            window.location.href = "panel_tecnico.html";
            return;
          }

        
if (mapaRoles.PROFESIONAL.includes(rolReal)) {
  window.location.href = "area_medica.html";
  return;
}


          if (rolReal === "admin") {
            window.location.href = "gestion_administrador.html";
            return;
          }

          mensaje.innerHTML = "Rol no autorizado.";
        } catch (error) {
          mensaje.innerHTML =
            "No se pudo conectar con el servidor de autenticación.";
          console.error(error);
        }
      }
    </script>
  <script src="mej-institucional.js"></script>
</body>
</html>
